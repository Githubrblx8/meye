version: '3.8'

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: m-eye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-secure-password}
      POSTGRES_DB: ${POSTGRES_DB:-meye}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - m-eye-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meye}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache & Queue
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: m-eye-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - m-eye-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Backend API + Web UI
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m-eye-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meye}:${POSTGRES_PASSWORD:-change-me-secure-password}@db:5432/${POSTGRES_DB:-meye}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    networks:
      - m-eye-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Frontend Web UI (React)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: m-eye-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - m-eye-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================
  # Worker (SMTP Gateway & Async Jobs)
  # ===========================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: m-eye-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meye}:${POSTGRES_PASSWORD:-change-me-secure-password}@db:5432/${POSTGRES_DB:-meye}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-0.0.0.0}
      SMTP_PORT: ${SMTP_PORT:-2525}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SMTP_PORT:-2525}:${SMTP_PORT:-2525}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    networks:
      - m-eye-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', ${SMTP_PORT:-2525})); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  m-eye-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
