[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/smtp",
    "crates/reputation",
    "crates/risk",
    "crates/worker",
    "crates/db",
    "crates/models",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["M'Eye Team"]
license = "AGPL-3.0"
description = "Open Source Email Security and Reputation Platform"

[workspace.dependencies]
# Web & API
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "request-id"] }
hyper = "1.1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "redis", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security
argon2 = "0.5"
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Email Parsing
mail-parser = "0.9"
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls"] }

# Logging & Error
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Testing
mockall = "0.12"
