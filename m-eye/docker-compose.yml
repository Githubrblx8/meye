version: "3.8"

services:
  # PostgreSQL Database - Source of Truth
  postgres:
    image: postgres:15-alpine
    container_name: m-eye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m_eye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m_eye_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-m_eye}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m_eye} -d ${POSTGRES_DB:-m_eye}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m-eye-network

  # Redis - Cache and Job Queue
  redis:
    image: redis:7-alpine
    container_name: m-eye-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m-eye-network

  # Backend API + Worker (Rust)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m-eye-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-m_eye}:${POSTGRES_PASSWORD:-m_eye_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-m_eye}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_key_in_production_minimum_32_chars}
      JWT_ISSUER: m-eye-api
      JWT_LIFETIME_SECS: 3600
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SMTP_PORT: 2525
      RUST_LOG: info
    ports:
      - "${API_PORT:-8000}:8000"
      - "${SMTP_PORT:-2525}:2525"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - m-eye-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  m-eye-network:
    driver: bridge
