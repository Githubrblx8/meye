version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meye_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_StrongPass!}
      POSTGRES_DB: ${POSTGRES_DB:-meye_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - meye-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meye_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meye-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - meye-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meye-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meye_user}:${POSTGRES_PASSWORD:-ChangeMe_StrongPass!}@db:5432/${POSTGRES_DB:-meye_db}
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      JWT_SECRET: ${JWT_SECRET:-ChangeThisToARandomSecretKeyAtLeast32CharsLong!}
      JWT_ISSUER: ${JWT_ISSUER:-m-eye-local}
    ports:
      - "3000:3000"
      - "2525:2525"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meye-net
    command: ["./meye-start"]

volumes:
  pgdata:
  redisdata:

networks:
  meye-net:
    driver: bridge
